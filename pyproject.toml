[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provmap"
version = "1.0.0"
description = "Open-Source Software Provenance Mapper: trace how vulnerable dependencies propagate through a project, with OSV advisories and maintainer/registry provenance signals."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "tomli>=2; python_version<'3.11'"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
provmap = "provmap.__main__:main"

[tool.setuptools.packages.find]
include = ["provmap*"]

[tool.setuptools.package-data]
provmap = ["static/*", "static/vendor/*", "static/vendor/images/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore:.*httpx.*"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "B905", "E501"]
